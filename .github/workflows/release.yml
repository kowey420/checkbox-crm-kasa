# Випуск нової версії каси.
# Як випустити: змінити APP_VERSION у checkbox_app.py (напр. "1.1.0"), закомітити й надіслати, далі
#   - або на GitHub: Actions → «Випуск» → Run workflow (тег v1.1.0 створиться сам),
#   - або тегом: git tag v1.1.0 && git push origin v1.1.0
# GitHub збере Kasa.exe (Windows), Kasa-mac.zip, kasa-py.zip і SHA256SUMS.txt та опублікує випуск.
# Каси з налаштованим оновленням побачать банер «Доступна нова версія».

name: Випуск

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Версія в коді збігається з тегом
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('checkbox_app.py', encoding='utf-8').read()).group(1))")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$V" != "$GITHUB_REF_NAME" ]; then
              echo "::error::APP_VERSION = $V у checkbox_app.py, а тег — $GITHUB_REF_NAME. Виправте одне з них."
              exit 1
            fi
          elif gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Випуск v$V вже існує. Збільште APP_VERSION у checkbox_app.py."
            exit 1
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Випуск v$V"
      - name: Код компілюється на Python 3.9 (вбудований у macOS)
        run: |
          python3 - <<'PY'
          import ast
          for f in ("checkbox_app.py", "checkbox_web.py", "goods_csv.py", "kasa_update.py"):
              ast.parse(open(f, encoding="utf-8").read(), feature_version=(3, 9))
              print("ok", f)
          PY

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Залежності
        run: pip install pyinstaller certifi pystray pillow
      - name: Зібрати Kasa.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name Kasa --icon kasa.ico
          --hidden-import goods_csv --hidden-import kasa_update --hidden-import pystray._win32
          --collect-data certifi --add-data "kasa.ico;." checkbox_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Kasa.exe

  mac-and-py:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Залежності
        run: pip install pillow certifi
      - name: Зібрати Каса.app (Kasa-mac.zip) і kasa-py.zip
        run: |
          python mac/build_mac_app.py
          mkdir -p out
          cp "mac/dist/Каса для Mac.zip" out/Kasa-mac.zip
          python - <<'PY'
          import zipfile
          files = ["checkbox_app.py", "checkbox_web.py", "goods_csv.py", "kasa_update.py", "kasa.ico",
                   "config.example.json", "Запустити касу.bat", "Запустити касу.command"]
          with zipfile.ZipFile("out/kasa-py.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  z.write(f, f)
          print("kasa-py.zip:", files)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: other
          path: out/*

  release:
    needs: [check-version, windows, mac-and-py]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Контрольні суми
        run: |
          cd out
          sha256sum Kasa.exe Kasa-mac.zip kasa-py.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            out/Kasa.exe
            out/Kasa-mac.zip
            out/kasa-py.zip
            out/SHA256SUMS.txt
          generate_release_notes: true
